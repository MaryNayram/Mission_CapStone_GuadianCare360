name: GuardianCare360 CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: course_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h "127.0.0.1" --silent; then
              break
            fi
            sleep 1
          done

      - name: Create task_management_db
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS task_management_db;"

      - name: Seed course_db
        run: |
          mysql -h 127.0.0.1 -u root -proot course_db <<EOF
          CREATE TABLE IF NOT EXISTS course (
            id INT AUTO_INCREMENT PRIMARY KEY,
            title VARCHAR(255),
            instructor VARCHAR(255)
          );
          INSERT INTO course (title, instructor) VALUES
            ('Christian Ethics', 'Dr. Hollinger'),
            ('Software Engineering', 'Prof. Mensah');
          EOF

      - name: Seed task_management_db
        run: |
          mysql -h 127.0.0.1 -u root -proot task_management_db <<EOF
          CREATE TABLE IF NOT EXISTS tasks (
            id INT AUTO_INCREMENT PRIMARY KEY,
            description TEXT,
            status VARCHAR(50)
          );
          INSERT INTO tasks (description, status) VALUES
            ('Fix deployment bug', 'pending'),
            ('Update dashboard UI', 'complete');
          EOF

      - name: Validate PHP syntax
        run: |
          find . -type f -name "*.php" -exec php -l {} \;

      - name: Run basic tests (optional)
        run: |
          echo "Add PHPUnit or custom test scripts here"

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd /var/www/guardiancare360
            git pull origin main
            echo "Deployment complete"
